name: Rust
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install build prerequisites
        run: sudo apt-get update && sudo apt-get install --yes libssl-dev pkg-config strace time
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: cargo +stable fmt --check
      - run: cargo +stable test --locked
      - name: Patched parser upstream regression tests
        run: cargo +stable test --manifest-path vendor/imap-proto/Cargo.toml --target-dir target/vendor-tests
      - name: Patched client upstream unit tests
        run: cargo +stable test --manifest-path vendor/imap/Cargo.toml --lib --target-dir target/vendor-client-tests
      - run: cargo +stable clippy --locked --all-targets -- -D warnings
      - run: cargo +stable build --locked
      - run: python3 tests/local/security.py
      - name: TLS migration and recovery tests with disposable Dovecot servers
        run: python3 tests/local/e2e.py
      - name: Reliability fault regressions
        run: python3 tests/local/reliability.py
      - name: Offline benchmark harness tests
        run: python3 -m unittest discover -s tests/local -p 'test_*.py'
      - name: Build isolated fault-injection binary
        run: cargo +stable build --locked --features fault-injection --target-dir target/fault-tests
      - name: Deterministic crash matrix with disposable Dovecot
        run: python3 tests/local/crash_matrix.py
      - name: Instrumented baseline smoke test
        run: python3 tests/local/benchmark.py --binary target/debug/imaplane --messages 10 --latency-ms 0 10 --repeats 1 --output target/benchmark-smoke.json
