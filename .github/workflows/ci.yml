name: Rust
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install build prerequisites
        run: sudo apt-get update && sudo apt-get install --yes libssl-dev pkg-config strace time
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: cargo +stable fmt --check
      - run: cargo +stable test --locked
      - name: Patched parser upstream regression tests
        run: cargo +stable test --manifest-path vendor/imap-proto/Cargo.toml --target-dir target/vendor-tests
      - name: Patched client upstream unit tests
        run: cargo +stable test --manifest-path vendor/imap/Cargo.toml --lib --target-dir target/vendor-client-tests
      - run: cargo +stable clippy --locked --all-targets -- -D warnings
      - run: cargo +stable build --locked
      - run: python3 tests/local/security.py
      - name: TLS migration and recovery tests with disposable Dovecot servers
        run: python3 tests/local/e2e.py
      - name: Reliability fault regressions
        run: python3 tests/local/reliability.py
      - name: Offline benchmark harness tests
        run: python3 -m unittest discover -s tests/local -p 'test_*.py'
      - name: Build isolated fault-injection binary
        run: cargo +stable build --locked --features fault-injection --target-dir target/fault-tests
      - name: Deterministic crash matrix with disposable Dovecot
        run: python3 tests/local/crash_matrix.py
      - name: Later-message, multi-folder, reconnect and upgrade crash matrix
        run: python3 tests/local/h5_crash_matrix.py
      - name: Commit-bound release benchmark snapshot
        run: python3 scripts/build-benchmark-binary.py
      - name: Instrumented baseline smoke test
        run: python3 tests/local/benchmark.py --binary target/release/imaplane --smoke --messages 10 --latency-ms 0 10 --repeats 1 --output target/benchmark-smoke.json
  memory:
    # Dedicated job: real peak-RSS measurement for large messages (see docs/STREAMING_DESIGN.md).
    # The "current" profile is a regression ceiling for the in-memory path; the streaming
    # profile enforces the design targets for destination verification (phase 3) and for a
    # full transfer through the disk spool (phase 4). The streaming path is opt-in until phase 5.
    # A roughly 1 GiB soak is manual.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install build prerequisites
        run: sudo apt-get update && sudo apt-get install --yes libssl-dev pkg-config time
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - run: cargo +stable build --release --locked
      - name: Peak RSS of a full transfer, default buffered path (rollback ceiling)
        run: python3 tests/local/memory.py target/release/imaplane --profile current --sizes 16 64 256 --json target/memory.json
      - name: Peak RSS of destination verification, buffered path (rollback ceiling)
        run: python3 tests/local/memory.py target/release/imaplane --profile current --scenario verify --sizes 16 64 256 --json target/memory-verify-buffered.json
      - name: Peak RSS of a full transfer with the disk spool on (streaming targets enforced)
        run: python3 tests/local/memory.py target/release/imaplane --profile streaming --threshold-bytes 0 --sizes 16 64 256 --json target/memory-migrate-streaming.json
      - name: Peak RSS of destination verification, streaming path (targets enforced)
        run: python3 tests/local/memory.py target/release/imaplane --profile streaming --scenario verify --threshold-bytes 0 --sizes 16 64 256 --json target/memory-verify-streaming.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: memory-measurements
          path: |
            target/memory.json
            target/memory-verify-buffered.json
            target/memory-verify-streaming.json
            target/memory-migrate-streaming.json
