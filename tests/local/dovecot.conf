protocols = imap
listen = *
mail_home = /srv/mail/%Lu
mail_location = maildir:~/Maildir
mail_uid = 1000
mail_gid = 1000
first_valid_uid = 1000
last_valid_uid = 1000
passdb {
  driver = static
  args = password=imaplane-test-only
}
userdb {
  driver = static
  args = uid=1000 gid=1000 home=/srv/mail/%Lu
}
ssl = required
ssl_min_protocol = TLSv1.2
ssl_cert = </etc/dovecot/tls.crt
ssl_key = </etc/dovecot/tls.key
namespace inbox {
  inbox = yes
  separator = /
}
service imap-login {
  inet_listener imaps {
    port = 993
    ssl = yes
  }
  inet_listener imap {
    port = 143
  }
}
log_path = /dev/stdout
info_log_path = /dev/stdout
