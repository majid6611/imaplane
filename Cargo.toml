[package]
name = "imaplane"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Safety-first IMAP mailbox migration"
license = "MIT"
publish = false

[features]
default = []
fault-injection = []

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = "0.4.45"
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3.5.2", features = ["termination"] }
fs2 = "0.4.3"
imap = "3.0.0-alpha.15"
imap-proto = "0.16.7"
libc = "0.2.191"
native-tls = "0.2.18"
rpassword = "7.5.4"
rusqlite = { version = "0.38", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "1.1.8"
zeroize = "1.9.1"

tempfile = "3"

[dev-dependencies]

[patch.crates-io]
imap-proto = { path = "vendor/imap-proto" }
imap = { path = "vendor/imap" }
