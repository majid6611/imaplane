# Disposable Dovecot used as BOTH source and destination in the benchmark (identical configuration).
# Same as tests/local/dovecot.conf plus an event exporter that logs every finished IMAP command.
protocols = imap
listen = *
mail_home = /srv/mail/%Lu
mail_location = maildir:~/Maildir
mail_uid = 1000
mail_gid = 1000
first_valid_uid = 1000
last_valid_uid = 1000
passdb {
  driver = static
  args = password=imaplane-test-only
}
userdb {
  driver = static
  args = uid=1000 gid=1000 home=/srv/mail/%Lu
}
ssl = required
ssl_min_protocol = TLSv1.2
ssl_cert = </etc/dovecot/tls.crt
ssl_key = </etc/dovecot/tls.key
namespace inbox {
  inbox = yes
  separator = /
}
service imap-login {
  inet_listener imaps {
    port = 993
    ssl = yes
  }
  inet_listener imap {
    port = 143
  }
}
# Every finished IMAP command is written to the log as one JSON event (command name, bytes in/out,
# running time). The benchmark reads those lines to count commands and application bytes without
# trusting either tool's own counters.
event_exporter log {
  format = json
  format_args = time-rfc3339
  transport = log
}
metric imap_command {
  filter = event=imap_command_finished
  exporter = log
}
log_path = /dev/stdout
info_log_path = /dev/stdout
