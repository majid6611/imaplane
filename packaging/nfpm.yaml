    dst: /usr/share/doc/imaplane/vendor/imap-proto/LICENSE-APACHE
    file_info:
      mode: 0644
overrides:
  deb:
    depends:
      - libc6 (>= 2.36)
      - libgcc-s1
      - libssl3 (>= 3.0.0)
      - ca-certificates
  rpm:
    depends:
      - glibc >= 2.34
      - libgcc
      - openssl-libs >= 3.0.7
      - ca-certificates
